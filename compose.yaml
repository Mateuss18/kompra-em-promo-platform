services:
  postgres:
    image: postgres:17-alpine
    container_name: kompra-em-promo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kompra_em_promo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kompra_em_promo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
